name: Latest blog posts
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    if: false  # disabled: no real blog feed configured yet — enable when feed_list points to a real RSS/Atom URL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://your-blog.com/feed.xml"
          comment_tag_name: BLOG-POST-LIST
          commit_message: "chore: update blog posts"
